# SoftyFy — local development infrastructure
#
# Starts a PostgreSQL 16 database used by the Spring Boot backend in the
# `local` profile. Credentials are read from the environment (see .env.example)
# and fall back to safe non-secret development defaults.
#
# Usage:
#   docker compose up -d
#   docker compose down        (keep data volume)
#   docker compose down -v     (remove data volume too)

name: softyfy

services:
  postgres:
    image: postgres:16.14
    container_name: softyfy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SOFTYFY_DB_NAME:-softyfy}
      POSTGRES_USER: ${SOFTYFY_DB_USER:-softyfy}
      POSTGRES_PASSWORD: ${SOFTYFY_DB_PASSWORD:-softyfy}
    ports:
      # Bind to loopback only — never exposed to the public network.
      - "127.0.0.1:${SOFTYFY_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SOFTYFY_DB_USER:-softyfy} -d ${SOFTYFY_DB_NAME:-softyfy}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
