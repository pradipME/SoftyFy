spring:
  application:
    name: softyfy
  profiles:
    active: ${SOFTYFY_PROFILE:local}
  web:
    cors:
      allowed-origins: ${SOFTYFY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      max-age: 3600

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
